<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join live · The Agastya Archive</title>
<meta name="robots" content="noindex,nofollow">
<script src="/site-config.js"></script>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/host/host.css">
<link rel="stylesheet" href="/host/live.css">
</head>
<body data-page="guest">
<main class="lv-guest" id="app">
  <div class="ptitle"><div><h1>Join the live show</h1><p class="mute" id="gvSubtitle">You’ll appear as a guest in the host’s podcast recording.</p></div><img src="/logo.svg" alt="" width="52" height="52"></div>
  <section class="card hf" id="gvJoinCard">
    <h2>Your name</h2>
    <label for="gvName">What should the host call you?</label><input id="gvName" maxlength="40" placeholder="e.g. Maya">
    <div class="acts"><button class="go" id="gvJoin" type="button">Join the room</button><span id="gvStatus" class="mute" role="status" aria-live="polite"></span></div>
  </section>
  <section id="gvLive" hidden>
    <div class="card hf">
      <h2 id="gvTitle">Live room</h2>
      <div class="lv-connection" id="gvConnection"><i></i><span id="gvConnText">Connecting…</span></div>
      <div class="acts"><button id="gvMute" type="button">Mute my mic</button><button id="gvLeave" type="button">Leave</button><b class="lv-timer" id="gvTimer">00:00</b></div>
    </div>
    <div class="card hf">
      <h2>Host chat</h2>
      <div class="lv-chat" id="gvChat" role="log" aria-live="polite"></div>
      <label for="gvMessage">Message or question for the host</label>
      <div class="pwrow"><input id="gvMessage" maxlength="1000" placeholder="Say something…"><button id="gvSend" type="button">Send</button></div>
      <div class="acts"><button id="gvAsk" type="button">Send as question</button></div>
    </div>
    <p class="fine">Use headphones if you can. Your mic is only sent to this room while you are connected. Sound effects and on-screen text are controlled by the host.</p>
  </section>
  <audio id="gvAudio" autoplay playsinline hidden></audio>
</main>
<div class="lv-overlay" id="gvOverlay" hidden><div class="lv-overlay-card"><h2 id="gvOverlayText"></h2><b class="lv-timer" id="gvOverlayTimer"></b></div></div>
<script src="/guest.js"></script>
</body></html>
